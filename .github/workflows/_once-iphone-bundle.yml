name: One-shot verify and rebuild HausKlima PR bundle
on:
  push:
    branches:
      - fix/iphone-overlays-editor-surfaces
permissions:
  contents: write
jobs:
  verify-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/iphone-overlays-editor-surfaces
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Exercise responsive card, editor and live input tests
        env:
          SKIP_WEBKIT: "1"
        run: npm run test:browser
      - name: Commit verified dist and remove this one-shot helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/hausklima-card.js
          git rm .github/workflows/_once-iphone-bundle.yml
          git commit -m "build: verified HACS bundle, remove temporary builder"
          git push origin HEAD:fix/iphone-overlays-editor-surfaces
