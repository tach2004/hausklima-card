name: Feature browser verification (temporary)
on:
  push:
    branches: [feat/house-photo-and-garage-zones]
    paths:
      - '.github/workflows/preview-feature.yml'
permissions:
  contents: write
jobs:
  visual-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/house-photo-and-garage-zones
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run responsive browser tests and record actual card screenshots
        env:
          SKIP_WEBKIT: '1'
          UPDATE_SCREENSHOTS: '1'
        run: npm run test:browser
      - name: Commit screenshots after passing the browser suite
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/phase-3/
          if ! git diff --cached --quiet; then
            git commit -m 'test: capture actual responsive house-climate screenshots'
            git push origin HEAD:feat/house-photo-and-garage-zones
          fi
