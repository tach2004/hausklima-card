name: Feature build verification (temporary)
on:
  push:
    branches: [feat/house-photo-and-garage-zones]
    paths:
      - '.github/workflows/build-feature.yml'
permissions:
  contents: write
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: feat/house-photo-and-garage-zones
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit compiled HACS asset to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/hausklima-card.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: update bundled HausKlima card with artwork'
            git push origin HEAD:feat/house-photo-and-garage-zones
          fi
