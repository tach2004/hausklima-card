# Temporary build helper for PR #5. Remove this file after regenerating dist.
name: Refresh PR #5 dist bundle
on:
  push:
    branches:
      - feat/house-photo-and-garage-zones
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/house-photo-and-garage-zones
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install Chromium for responsive browser checks
        run: npx playwright install --with-deps chromium
      - name: Run responsive browser checks (desktop + phone emulation)
        run: npm run test:browser
      - name: Commit only the rebuilt distribution (without merging PR)
        shell: bash
        run: |
          git add dist/hausklima-card.js
          if git diff --cached --quiet; then
            echo "Distribution already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: rebuild HausKlima Card for PR 5"
          git push origin HEAD:feat/house-photo-and-garage-zones
